<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ZeroBeat Music</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header>

<h1>ZeroBeat 🎧</h1>

<input type="text" id="search" placeholder="Cari lagu...">

</header>

<div class="player">

<img id="cover">

<h2 id="title"></h2>
<p id="artist"></p>

<canvas id="visualizer"></canvas>

<audio id="audio" controls controlsList="nodownload"></audio>

<input type="range" id="progress">

<div class="controls">

<button onclick="prevSong()">⏮</button>
<button onclick="playSong()">▶</button>
<button onclick="nextSong()">⏭</button>

<button onclick="toggleFav()">❤️</button>

</div>

</div>

<div id="lyrics"></div>

<div id="playlist"></div>

</div>

<script src="script.js"></script>

</body>
</html>
